[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "baseline"
version = "0.1.0"
description = "Schedule intelligence for data-center construction: ingest, history, health, and slip prediction."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Sajan Shergill" }]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "typer>=0.12",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "numpy>=1.26",
    "lightgbm>=4.3",
    "boto3>=1.34",
]

[project.optional-dependencies]
orchestration = ["dagster>=1.7", "dagster-webserver>=1.7"]
dashboard = ["streamlit>=1.35"]
dev = [
    "pytest>=8",
    "moto[s3]>=5",
    "ruff>=0.4",
    "mypy>=1.10",
    "dagster>=1.7",
    "dagster-webserver>=1.7",
    "streamlit>=1.35",
]

# This line is what makes `baseline load ...` work as a command.
[project.scripts]
baseline = "baseline.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
baseline = ["ml/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running Postgres (docker compose up -d)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]